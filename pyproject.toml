[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeda"
version = "0.1.0"
description = "Terminal-native Exploratory Data Analysis CLI powered by Python & Click"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "GFG OS Management", email = "harpreet.02007@gmail.com" }
]
keywords = ["eda", "cli", "data-analysis", "terminal", "exploratory-data-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]

dependencies = [
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0",
  "isort>=5.12",
  "mypy>=1.0",
]

[project.scripts]
autoeda = "autoeda.cli.main:cli"

[project.urls]
Homepage = "https://github.com/GFG-OS-MANAGEMENT/AutoEDA"
Repository = "https://github.com/GFG-OS-MANAGEMENT/AutoEDA.git"
Issues = "https://github.com/GFG-OS-MANAGEMENT/AutoEDA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoeda*"]

# --------------------------------------------------------------------------- #
#  Tooling configuration
# --------------------------------------------------------------------------- #

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
